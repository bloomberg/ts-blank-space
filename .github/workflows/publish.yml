name: Node.js Package

on:
    release:
        types:
            - created

permissions:
    id-token: write # Required for OIDC
    contents: read

jobs:
    publish:
        name: Publish
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false
            - run: npm ci
            # Build explicitly so publishing doesn't depend on lifecycle scripts (e.g. ignore-scripts)
            - run: npm run gen-types
            - run: npm run build
            - run: npm publish
